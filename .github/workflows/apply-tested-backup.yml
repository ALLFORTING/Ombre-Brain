name: Apply tested backup feature

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-tested-backup.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply verified local patch
        env:
          PATCH_B64:         run: |
          printf '%s' "$PATCH_B64" | base64 --decode > /tmp/backup-feature.patch
          echo "bb74e0ff0d4b74829d7a86fec3cd7510fdcbc891068fd969b0bb175e9b8b4bbb  /tmp/backup-feature.patch" | sha256sum --check --strict -
          git apply --check /tmp/backup-feature.patch
          git apply /tmp/backup-feature.patch
          rm .github/workflows/apply-tested-backup.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add --all
          git commit -m "feat: add authenticated full-library backup export"
          git push
