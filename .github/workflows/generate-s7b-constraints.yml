name: Generate S7B Linux constraints

on:
  push:
    branches:
      - feat/s7b

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12.14
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'

      - name: Print runtime versions
        run: |
          python --version
          pip --version

      - name: Install pip-tools in the ephemeral runner
        run: python -m pip install --disable-pip-version-check pip-tools

      - name: Prepare temporary constraints input
        run: printf '%s\n' '-r requirements.txt' 'pytest' 'pytest-asyncio' > .s7b-constraints-input.txt

      - name: Generate Linux constraints
        run: |
          trap 'rm -f .s7b-constraints-input.txt' EXIT
          pip-compile --strip-extras --output-file=constraints-py312-linux.txt .s7b-constraints-input.txt

      - name: Remove direct Remember-Me entry and validate constraints
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          expected_url = (
              'https://github.com/peanutsuee/Remember-Me/releases/download/'
              'v0.1.0-dev.7-public.1/'
              'Remember-Me-0.1.0.dev7-public.1-a00ea991442d7581a3856b178525a8e77da833fe.tar.gz'
          )
          expected_digest = '80a0b334f08db19c95c053537dec484be645f29fcf67898037e6641224012214'
          expected_requirement = f'remember-me @ {expected_url}#sha256={expected_digest}'

          requirements = Path('requirements.txt').read_text(encoding='utf-8')
          source_lines = [
              line.strip()
              for line in requirements.splitlines()
              if line.strip() and not line.lstrip().startswith('#')
          ]
          remember_me_lines = [
              line
              for line in source_lines
              if re.fullmatch(r'remember-me\s*@\s*\S+#sha256=[0-9a-f]{64}', line, re.IGNORECASE)
          ]
          if remember_me_lines != [expected_requirement]:
              raise SystemExit('Remember-Me immutable URL/SHA-256 in requirements.txt changed')

          constraints_path = Path('constraints-py312-linux.txt')
          constraint_lines = constraints_path.read_text(encoding='utf-8').splitlines(keepends=True)
          filtered_lines = []
          removed_remember_me = 0
          for line in constraint_lines:
              active = line.strip()
              if re.fullmatch(r'remember-me\s*@\s*\S+#sha256=[0-9a-f]{64}', active, re.IGNORECASE):
                  removed_remember_me += 1
                  continue
              filtered_lines.append(line)

          if removed_remember_me != 1:
              raise SystemExit('Expected exactly one Remember-Me direct URL entry to remove')

          first_active = next(
              (
                  index
                  for index, line in enumerate(filtered_lines)
                  if line.strip() and not line.lstrip().startswith('#')
              ),
              None,
          )
          if first_active is None:
              raise SystemExit('Generated constraints file has no package entries')

          stable_header = (
              '# Generated in GitHub Actions Ubuntu with CPython 3.12.14 from '
              'requirements.txt plus pytest and pytest-asyncio using '
              'pip-compile --strip-extras.\n'
          )
          final_lines = [stable_header] + filtered_lines[first_active:]
          constraints_path.write_text(''.join(final_lines), encoding='utf-8', newline='\n')

          active_lines = [
              line.strip()
              for line in ''.join(final_lines).splitlines()
              if line.strip() and not line.lstrip().startswith('#')
          ]
          for line in active_lines:
              if '@' in line:
                  raise SystemExit('Constraint contains a direct URL entry')
              if re.match(r'(?i)^(?:-e|--editable)(?:\s|$)', line):
                  raise SystemExit('Constraint contains an editable entry')
              if re.match(r'(?i)^[a-z0-9_.-]+\[[^]]+\]', line):
                  raise SystemExit('Constraint contains extras')
              if '/' in line or '\\' in line:
                  raise SystemExit('Constraint contains a local path')

          if any(re.match(r'(?i)^remember-me\s*@', line) for line in active_lines):
              raise SystemExit('Constraint still contains a Remember-Me direct URL entry')

          for package in ('pytest', 'pytest-asyncio'):
              if not any(re.match(rf'(?i)^{re.escape(package)}==\S+', line) for line in active_lines):
                  raise SystemExit(f'{package} is not pinned in the constraints file')
          PY

      - name: Validate runtime requirements
        run: pip install --no-cache-dir -r requirements.txt -c constraints-py312-linux.txt

      - name: Validate CI test tooling
        run: pip install pytest pytest-asyncio -c constraints-py312-linux.txt

      - name: Check installed dependencies
        run: pip check

      - name: Upload Linux constraints artifact
        uses: actions/upload-artifact@v4
        with:
          name: constraints-py312-linux
          path: constraints-py312-linux.txt
          if-no-files-found: error
