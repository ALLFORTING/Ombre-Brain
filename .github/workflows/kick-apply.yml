name: Kick tested patch application

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  issues:
    types: [opened]

permissions:
  actions: write
  contents: write
  issues: write

jobs:
  dispatch:
    if: github.event_name != 'issues' || github.event.issue.title == '[automation] apply tested backup patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dispatch verified patch workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run apply-tested-backup.yml --ref main
      - name: Close trigger issue
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue close "${{ github.event.issue.number }}" --comment "Verified patch workflow dispatched."
      - name: Remove one-time scheduler
        run: |
          rm .github/workflows/kick-apply.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add --all
          git commit -m "chore: remove backup patch scheduler"
          git push
