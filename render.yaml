services:
  - type: web
    name: ombre-brain
    env: python
    region: oregon
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python backup_entry.py
    envVars:
      - key: OMBRE_TRANSPORT
        value: streamable-http
      - key: OMBRE_API_KEY
        sync: false          # Set in Render dashboard > Environment (any OpenAI-compatible key)
      - key: OMBRE_BASE_URL
        sync: false          # e.g. https://api.deepseek.com/v1 or https://api.siliconflow.cn/v1
      - key: OMBRE_EMBEDDING_API_KEY
        sync: false
      - key: OMBRE_EMBEDDING_BASE_URL
        value: https://api.siliconflow.com/v1
      - key: OMBRE_EMBEDDING_MODEL
        # International SiliconFlow catalog differs from the China service.
        value: Qwen/Qwen3-Embedding-0.6B
      - key: OMBRE_BUCKETS_DIR
        value: /opt/render/project/src/buckets
    disk:
      name: ombre-buckets
      mountPath: /opt/render/project/src/buckets
      sizeGB: 1
